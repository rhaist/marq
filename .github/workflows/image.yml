# Builds the multi-GB Kali image, runs scripts/e2e-image.sh (the promises that
# only hold for the running image: /work bind-mount persistence and per-container
# jwt keys), and — on main — publishes it to GHCR so users can pull instead of
# building. Expensive, so it only triggers when the image definition or its e2e
# scripts change; Go-only changes are covered by ci.yml. Run on demand via the
# Actions tab (workflow_dispatch).
name: image

on:
  push:
    branches: [main]
    paths: &image-paths
      - Dockerfile
      - scripts/entrypoint.sh
      - scripts/e2e-image.sh
  pull_request:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR with the built-in GITHUB_TOKEN (publish step only)

# Cancel an in-progress image build when a newer commit supersedes it — the
# ~35-min rebuild is the expensive one to leave running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: build image
        run: docker build -t marq .
      - name: e2e (image)
        run: bash scripts/e2e-image.sh --image marq
      # Publish only after e2e passes, and only from main (a dispatch on main
      # publishes too; PRs and other branches never do). Reuses the tested image.
      - name: publish to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          img="ghcr.io/${REPO,,}"
          docker tag marq "$img:latest"
          docker tag marq "$img:sha-${SHA::7}"
          docker push "$img:latest"
          docker push "$img:sha-${SHA::7}"
