# Builds the multi-GB Kali image, runs scripts/e2e-image.sh (the promises that
# only hold for the running image: /work bind-mount persistence and per-container
# jwt keys), and — on main — publishes it to GHCR so users can pull instead of
# building. Expensive, so it only triggers when something that ends up IN the
# image changes: the image definition/scripts, or the Go sources + go:embed'd
# skills the `marq` binary is built from (cmd/**, internal/**, go.mod/go.sum).
# pi/** counts too: the shim and prompts are go:embed'd so `marq shim` / `marq
# prompt` can emit them from the image, so editing one without a rebuild would
# ship a stale copy. docs/ is not in the image. Run on demand via the Actions
# tab (workflow_dispatch).
name: image

on:
  push:
    branches: [main]
    paths: &image-paths
      - Dockerfile
      - scripts/entrypoint.sh
      - scripts/e2e-image.sh
      - cmd/**
      - internal/**
      - pi/** # go:embed'd into the binary — see the header note
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR with the built-in GITHUB_TOKEN (publish step only)

# Cancel an in-progress image build when a newer commit supersedes it — the
# ~35-min rebuild is the expensive one to leave running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per architecture on a NATIVE runner (no QEMU — emulating the Kali apt
  # install would take hours). Each builds, e2e-tests its own arch, and on main
  # pushes an arch-tagged image. The manifest job then stitches them into a single
  # multi-arch tag so `docker pull` picks the right arch (native arm64 on Apple
  # Silicon instead of emulated amd64).
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: build image
        run: docker build -t marq .
      - name: e2e (image)
        run: bash scripts/e2e-image.sh --image marq
      # Push an arch-tagged image after e2e passes, only from main. The manifest
      # job below combines the arch tags into the user-facing :latest / :sha-….
      - name: publish arch image to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          img="ghcr.io/${REPO,,}"
          docker tag marq "$img:sha-${SHA::7}-$ARCH"
          docker push "$img:sha-${SHA::7}-$ARCH"

  # Combine the per-arch images into one multi-arch manifest list.
  manifest:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: create multi-arch manifest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          img="ghcr.io/${REPO,,}"
          sha="sha-${SHA::7}"
          for tag in "$sha" latest; do
            docker buildx imagetools create -t "$img:$tag" \
              "$img:$sha-amd64" "$img:$sha-arm64"
          done
