# CI for contributions.
#
#  gate  — the documented `go build && go vet && go test` plus scripts/e2e.sh
#          (the user-promise journey through the bare binary). Fast, no Docker,
#          runs on every push and PR.
#  image — builds the multi-GB Kali image and runs scripts/e2e-image.sh (the
#          promises that only hold for the running image: /work persistence,
#          per-container jwt keys). Expensive, so it runs on main, on manual
#          dispatch, and on PRs that touch the image definition or its tests —
#          not on every PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: e2e (binary)
        run: bash scripts/e2e.sh

  image:
    # On PRs the heavy steps run only when the image or its e2e scripts changed
    # (the gate already covers Go-only PRs); on push/dispatch they always run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: relevant changes?
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(Dockerfile|scripts/entrypoint\.sh|scripts/e2e-image\.sh|scripts/verify_tools\.sh)$'; then
              echo "run=true" >>"$GITHUB_OUTPUT"
            else
              echo "run=false" >>"$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - name: free disk space
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: build image
        if: steps.changed.outputs.run == 'true'
        run: docker build -t marq .
      - name: e2e (image)
        if: steps.changed.outputs.run == 'true'
        run: bash scripts/e2e-image.sh --image marq
