# Go sanity gate — the documented `go build ./... && go vet ./... && go test ./...`.
# The full Docker image build and scripts/test_tools.py end-to-end coverage are
# intentionally not run here: the image is multi-GB and the wrapped tool binaries
# only exist inside the Kali image. The Go-level gate runs on any OS.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
