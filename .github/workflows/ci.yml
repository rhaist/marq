# Fast gate for every push/PR — the documented `go build && go vet && go test`
# plus scripts/e2e.sh (the user-promise journey through the bare binary). No
# Docker; the image build + its e2e live in image.yml (path-gated).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a running gate when a newer commit lands on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: e2e (binary)
        run: bash scripts/e2e.sh
      # Pins the leaderboard's scoring invariants (capability pool vs safety gate).
      # Pure-python, no model or server needed — it went red unnoticed once because
      # nothing ran it.
      - name: eval scoring invariants
        run: python3 scripts/eval/test_report.py
