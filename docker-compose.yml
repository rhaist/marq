# Convenience compose file. Primarily useful for building and for an
# interactive shell; LM Studio itself launches the container via mcp.json
# (see mcp.json.example).
services:
  marq:
    build: .
    image: marq
    # stdio server needs an attached stdin; compose is mainly for build/shell.
    stdin_open: true
    tty: false
    environment:
      MARQ_OPERATOR: "${USER:-operator}"
      MARQ_ENGAGEMENT: "local-lab"
      MARQ_SCOPE: "ONLY systems you are authorized to test"
      # Arbitrary-shell tool. On by default; set "false" to disable.
      MARQ_ALLOW_RAW_SHELL: "true"
      # Optional OSINT API keys (inherited from the host shell; blank = keyless).
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      CENSYS_API_ID: "${CENSYS_API_ID:-}"
      CENSYS_API_SECRET: "${CENSYS_API_SECRET:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      NUMVERIFY_API_KEY: "${NUMVERIFY_API_KEY:-}"
    volumes:
      # Persist the audit log on the host so it survives container removal.
      - ./audit:/var/log/marq
      # Optional working dir for wordlists, hash files, scan output.
      - ./work:/work
    # Hardening: no new privileges. Network is needed for scanning, so it is
    # left on the default bridge — restrict it at the host/firewall level.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
